services:
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - '80:80'
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    restart: unless-stopped

  api:
    build: ../server
    expose:
      - '8787'
    environment:
      PORT: '8787'
      LAKE_BASE: https://your-data-lake.example.com
      LAKE_TENANT: cloudlet
      LAKE_COLLECTION: saves
      # 数据湖内部密钥，只在服务端。切勿写进前端产物。
      INTERNAL_KEY: ${INTERNAL_KEY:?请设置 INTERNAL_KEY}
    restart: unless-stopped
